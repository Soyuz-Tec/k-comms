name: ${K_COMMS_RELEASE_PROJECT:-k-comms-release}

x-release-environment: &release-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
  PASSWORD_RECOVERY_SIGNING_KEY: ${PASSWORD_RECOVERY_SIGNING_KEY:?PASSWORD_RECOVERY_SIGNING_KEY is required}
  PHX_HOST: ${PHX_HOST:-127.0.0.1}
  PORT: "4000"
  POOL_SIZE: ${POOL_SIZE:-10}
  K_COMMS_ROLE: all
  K_COMMS_RELEASE_REVISION: ${K_COMMS_RELEASE_REVISION:?K_COMMS_RELEASE_REVISION is required}
  ALLOW_BOOTSTRAP: ${ALLOW_BOOTSTRAP:-true}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
  SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-2592000}
  PASSWORD_RECOVERY_TTL_SECONDS: ${PASSWORD_RECOVERY_TTL_SECONDS:-1800}
  PASSWORD_RECOVERY_RETENTION_SECONDS: ${PASSWORD_RECOVERY_RETENTION_SECONDS:-2592000}
  PASSWORD_RECOVERY_MIN_RESPONSE_MS: ${PASSWORD_RECOVERY_MIN_RESPONSE_MS:-500}
  PASSWORD_RECOVERY_JITTER_MS: ${PASSWORD_RECOVERY_JITTER_MS:-50}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  HSTS_ENABLED: "false"
  CSP_CONNECT_SOURCES: ${CSP_CONNECT_SOURCES:?CSP_CONNECT_SOURCES is required}
  ALLOW_DEVELOPMENT_ADAPTERS: "true"
  AUDIO_PROVIDER_MODE: livekit
  LIVEKIT_SERVER_URL: ${LIVEKIT_SERVER_URL:?LIVEKIT_SERVER_URL is required}
  LIVEKIT_API_URL: http://livekit:7880
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
  AUDIO_TOKEN_TTL_SECONDS: "300"
  AUDIO_PARTICIPANT_EVICTION_ENFORCEMENT_SECONDS: "660"
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
  S3_INTERNAL_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-k-comms-release}
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  NOTIFICATION_PROVIDER_MODE: log
  NOTIFICATION_PROVIDER_NAME: local-release-log
  ATTACHMENT_SCANNER_MODE: allow_all
  ATTACHMENT_SCANNER_PROVIDER_NAME: local-release-allow-all
  WEBHOOK_PROVIDER_MODE: log
  WEBHOOK_ALLOWED_HOSTS: webhook.local
  WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?WEBHOOK_SECRET_ENCRYPTION_KEY is required}
  WEBHOOK_SECRET_ENCRYPTION_KEY_ID: primary
  PUSH_SUBSCRIPTION_ENCRYPTION_KEY: ${PUSH_SUBSCRIPTION_ENCRYPTION_KEY:?PUSH_SUBSCRIPTION_ENCRYPTION_KEY is required}
  PUSH_SUBSCRIPTION_ENCRYPTION_KEY_ID: primary
  WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:?WEB_PUSH_VAPID_PUBLIC_KEY is required}
  METRICS_ALLOW_UNAUTHENTICATED: "false"
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}

services:
  postgres:
    image: docker.io/library/postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kcomms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-k_comms_release}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:?MINIO_API_CORS_ALLOW_ORIGIN is required}
    ports:
      - "127.0.0.1:${K_COMMS_RELEASE_MINIO_PORT:-5900}:9000"
      - "127.0.0.1:${K_COMMS_RELEASE_MINIO_CONSOLE_PORT:-5901}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc version enable "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-k-comms-release}
    restart: "no"

  livekit:
    image: docker.io/livekit/livekit-server:v1.12.0@sha256:b1281e66e35e8f9749ffbcf0fe6ab4d40d1438aa00f36c2ea7e6975e5e261e2e
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
    command:
      - --bind
      - 0.0.0.0
      - --node-ip
      - 127.0.0.1
      - --rtc.tcp_port
      - "${K_COMMS_RELEASE_LIVEKIT_TCP_PORT:-7981}"
      - --udp-port
      - "${K_COMMS_RELEASE_LIVEKIT_UDP_PORT:-7982}"
    ports:
      - "127.0.0.1:${K_COMMS_RELEASE_LIVEKIT_SIGNAL_PORT:-7980}:7880/tcp"
      - "127.0.0.1:${K_COMMS_RELEASE_LIVEKIT_TCP_PORT:-7981}:${K_COMMS_RELEASE_LIVEKIT_TCP_PORT:-7981}/tcp"
      - "127.0.0.1:${K_COMMS_RELEASE_LIVEKIT_UDP_PORT:-7982}:${K_COMMS_RELEASE_LIVEKIT_UDP_PORT:-7982}/udp"

  migrate:
    image: ${K_COMMS_RELEASE_IMAGE:?K_COMMS_RELEASE_IMAGE is required}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      <<: *release-environment
      K_COMMS_RUNTIME_PURPOSE: one_shot
      K_COMMS_LOCAL_RELEASE: "false"
      PUBLIC_APP_URL: https://localhost
      AUDIO_PROVIDER_MODE: disabled
      LIVEKIT_SERVER_URL: ""
      LIVEKIT_API_URL: ""
    command: ["eval", "CommsCore.Release.migrate()"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ${K_COMMS_RELEASE_IMAGE:?K_COMMS_RELEASE_IMAGE is required}
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        OCI_SOURCE: https://github.com/Soyuz-Tec/k-comms
        OCI_REVISION: ${K_COMMS_RELEASE_REVISION:?K_COMMS_RELEASE_REVISION is required}
        OCI_VERSION: ${K_COMMS_RELEASE_VERSION:?K_COMMS_RELEASE_VERSION is required}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      <<: *release-environment
      K_COMMS_RUNTIME_PURPOSE: application
      K_COMMS_LOCAL_RELEASE: "true"
    ports:
      - "127.0.0.1:${K_COMMS_RELEASE_APP_PORT:-4188}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:4000/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    stop_grace_period: 30s

volumes:
  postgres-data: {}
  minio-data: {}
