apiVersion: apps/v1
kind: Deployment
metadata:
  name: k-comms-worker
  labels:
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        k-comms.soyuz-tec.io/rollback-capabilities: guest_identity_v1,guest_admission_expiry_worker_v1,instant_room_lifecycle_v1,instant_room_presence_lease_v1,instant_room_expiry_worker_v1,conversation_only_human_v1
      labels:
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: k-comms
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/soyuz-tec/k-comms:staging
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: k-comms-config
            - secretRef:
                name: k-comms-provider-secrets
                optional: true
          env:
            - name: K_COMMS_ROLE
              value: worker
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTER_DNS_QUERY
              value: k-comms-cluster.$(POD_NAMESPACE).svc.cluster.local
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELEASE_DISTRIBUTION
              value: name
            - name: RELEASE_NODE
              value: k_comms@$(POD_IP)
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: k-comms-secrets
                  key: RELEASE_COOKIE
            - name: ERL_AFLAGS
              value: -proto_dist inet_tcp -kernel inet_dist_listen_min 9100 inet_dist_listen_max 9100
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: k-comms-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: k-comms-secrets
                  key: SECRET_KEY_BASE
            - name: PASSWORD_RECOVERY_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: k-comms-secrets
                  key: PASSWORD_RECOVERY_SIGNING_KEY
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: k-comms-secrets
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: k-comms-secrets
                  key: S3_SECRET_ACCESS_KEY
            - name: WEBHOOK_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: k-comms-secrets
                  key: WEBHOOK_SECRET_ENCRYPTION_KEY
                  optional: true
            - name: WEBHOOK_SECRET_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: k-comms-secrets
                  key: WEBHOOK_SECRET_ENCRYPTION_KEYS
                  optional: true
            - name: PUSH_SUBSCRIPTION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: k-comms-secrets
                  key: PUSH_SUBSCRIPTION_ENCRYPTION_KEY
                  optional: true
            - name: PUSH_SUBSCRIPTION_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: k-comms-secrets
                  key: PUSH_SUBSCRIPTION_ENCRYPTION_KEYS
                  optional: true
          ports:
            - name: epmd
              containerPort: 4369
              protocol: TCP
            - name: distribution
              containerPort: 9100
              protocol: TCP
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "ERL_AFLAGS= /app/bin/k_comms rpc '{:ok, _latency} = CommsCore.Operations.database_readiness(); pid = Oban.whereis(Oban); true = is_pid(pid); :ok'"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "ERL_AFLAGS= /app/bin/k_comms rpc '{:ok, _latency} = CommsCore.Operations.database_readiness(); pid = Oban.whereis(Oban); true = is_pid(pid); :ok'"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "ERL_AFLAGS= /app/bin/k_comms rpc 'System.schedulers_online() > 0'"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
