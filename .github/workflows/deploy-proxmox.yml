name: Deploy Proxmox

on:
  workflow_call:
    inputs:
      environment:
        description: Protected deployment environment
        required: true
        type: string
      image:
        description: Immutable GHCR image digest reference
        required: true
        type: string
      revision:
        description: Exact 40-character main commit
        required: true
        type: string
      bootstrap:
        description: Idempotently create the synthetic staging tenant
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      environment:
        description: Manual staging only; use the complete Container workflow for production
        required: true
        type: choice
        options:
          - staging
      image:
        description: Immutable GHCR image digest reference
        required: true
        type: string
      revision:
        description: Exact 40-character main commit
        required: true
        type: string
      bootstrap:
        description: Idempotently create the synthetic staging tenant
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: read
  attestations: read

concurrency:
  group: deploy-proxmox-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
      - name: Enforce main revision and immutable image coordinates
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          REVISION: ${{ inputs.revision }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_ENVIRONMENT" == staging || "$DEPLOY_ENVIRONMENT" == production ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/soyuz-tec/k-comms@sha256:[0-9a-f]{64}$ ]]
          [[ "$(git rev-parse HEAD)" == "$REVISION" ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$REVISION" ]]
          if [[ "$BOOTSTRAP" == true && "$DEPLOY_ENVIRONMENT" != staging ]]; then
            echo "Bootstrap is permitted only in staging." >&2
            exit 1
          fi
      - name: Require exact-revision CI and same-run staging qualification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_IMAGE: ${{ inputs.image }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: >-
          python scripts/verify_release_gates.py
          --environment "$RELEASE_ENVIRONMENT"
          --image "$RELEASE_IMAGE"
          --revision "$RELEASE_REVISION"
          --wait-seconds 2100
      - name: Authenticate to GHCR without persisting a credential
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh auth token | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify main-bound build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "oci://${IMAGE}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/container.yml" \
            --source-digest "$REVISION" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Verify main-bound CycloneDX SBOM attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "oci://${IMAGE}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/container.yml" \
            --source-digest "$REVISION" \
            --source-ref refs/heads/main \
            --predicate-type https://cyclonedx.org/bom \
            --deny-self-hosted-runners
      - name: Validate the Proxmox deployment contract
        run: |
          python scripts/test_validate_proxmox_bundle.py
          python scripts/validate_proxmox_bundle.py
          pwsh -NoProfile -File scripts/test_proxmox_native_commands.ps1
          bash scripts/test_proxmox_livekit_runtime.sh

  deploy:
    needs: verify-artifact
    runs-on: [self-hosted, x64, k-comms-deploy]
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Reconfirm the approved revision is still protected main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          $head = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()
          if (
              $head -ne "${{ inputs.revision }}" -or
              $main -ne "${{ inputs.revision }}"
          ) {
              throw "The approved revision is no longer the current protected main"
          }
      - name: Recheck release evidence after approval before host access
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_IMAGE: ${{ inputs.image }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          python scripts/verify_release_gates.py `
              --environment $env:RELEASE_ENVIRONMENT `
              --image $env:RELEASE_IMAGE `
              --revision $env:RELEASE_REVISION
          if ($LASTEXITCODE -ne 0) {
              throw "Release evidence changed or expired while awaiting approval"
          }
      - name: Materialize protected SSH inputs
        shell: pwsh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.K_COMMS_DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.K_COMMS_DEPLOY_HOST_KEY }}
          LIVEKIT_CLOUD_CREDENTIAL: ${{ secrets.K_COMMS_LIVEKIT_CLOUD_CREDENTIAL }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "k-comms-deploy-key"
          $knownHostsPath = Join-Path $env:RUNNER_TEMP "k-comms-known-hosts"
          $liveKitCredentialPath = Join-Path $env:RUNNER_TEMP "k-comms-livekit.json"
          $liveKitCredential = $env:LIVEKIT_CLOUD_CREDENTIAL.Trim()
          $liveKitDocument = $liveKitCredential | ConvertFrom-Json
          $propertyNames = @($liveKitDocument.PSObject.Properties.Name | Sort-Object)
          if (
              ($propertyNames -join ",") -ne "apiKey,apiSecret,url" -or
              $liveKitDocument.url -notmatch "^wss://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.livekit\.cloud$" -or
              $liveKitDocument.apiKey -notmatch "^API[A-Za-z0-9_-]{8,}$" -or
              $liveKitDocument.apiSecret -notmatch "^[A-Za-z0-9_-]{32,}$"
          ) {
              throw "Protected LiveKit Cloud credential has an invalid shape"
          }
          [IO.File]::WriteAllText(
              $keyPath,
              $env:DEPLOY_SSH_KEY.Trim() + [Environment]::NewLine,
              [Text.UTF8Encoding]::new($false)
          )
          [IO.File]::WriteAllText(
              $knownHostsPath,
              $env:DEPLOY_HOST_KEY.Trim() + [Environment]::NewLine,
              [Text.UTF8Encoding]::new($false)
          )
          [IO.File]::WriteAllText(
              $liveKitCredentialPath,
              $liveKitCredential + [Environment]::NewLine,
              [Text.UTF8Encoding]::new($false)
          )
          foreach ($path in @($keyPath, $liveKitCredentialPath)) {
              if ($IsWindows) {
                  $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
                  & icacls.exe $path /inheritance:r /grant:r "$identity`:(R)" |
                      Out-Null
                  if ($LASTEXITCODE -ne 0) {
                      throw "Failed to restrict a protected deployment input ACL"
                  }
              }
              else {
                  & chmod 0600 -- $path
                  if ($LASTEXITCODE -ne 0) {
                      throw "Failed to restrict a protected deployment input mode"
                  }
              }
          }
          "DEPLOY_KEY_PATH=$keyPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DEPLOY_KNOWN_HOSTS_PATH=$knownHostsPath" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LIVEKIT_CREDENTIAL_PATH=$liveKitCredentialPath" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Deploy and verify the approved digest
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ vars.K_COMMS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.K_COMMS_DEPLOY_USER }}
        run: |
          $arguments = @{
              Environment = "${{ inputs.environment }}"
              DeployHost = $env:DEPLOY_HOST
              DeployUser = $env:DEPLOY_USER
              SshKeyPath = $env:DEPLOY_KEY_PATH
              KnownHostsPath = $env:DEPLOY_KNOWN_HOSTS_PATH
              Image = "${{ inputs.image }}"
              Revision = "${{ inputs.revision }}"
              BundlePath = (Join-Path $env:GITHUB_WORKSPACE "deploy/proxmox")
              LiveKitCredentialPath = $env:LIVEKIT_CREDENTIAL_PATH
          }
          if ("${{ inputs.bootstrap }}" -eq "true") {
              $arguments.Bootstrap = $true
          }
          & (Join-Path $env:GITHUB_WORKSPACE "scripts\proxmox\deploy-remote.ps1") @arguments
      - name: Rehearse staging rollback, reactivation, and isolated restore
        if: inputs.environment == 'staging'
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ vars.K_COMMS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.K_COMMS_DEPLOY_USER }}
        run: |
          & (
              Join-Path $env:GITHUB_WORKSPACE `
                  "scripts\proxmox\qualify-staging-remote.ps1"
          ) `
              -DeployHost $env:DEPLOY_HOST `
              -DeployUser $env:DEPLOY_USER `
              -SshKeyPath $env:DEPLOY_KEY_PATH `
              -KnownHostsPath $env:DEPLOY_KNOWN_HOSTS_PATH `
              -Image "${{ inputs.image }}" `
              -Revision "${{ inputs.revision }}"
      - name: Prove staging reboot recovery for the qualified digest
        if: inputs.environment == 'staging'
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ vars.K_COMMS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.K_COMMS_DEPLOY_USER }}
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE "scripts/proxmox/qualify-staging-reboot-remote.ps1") `
              -DeployHost $env:DEPLOY_HOST `
              -DeployUser $env:DEPLOY_USER `
              -SshKeyPath $env:DEPLOY_KEY_PATH `
              -KnownHostsPath $env:DEPLOY_KNOWN_HOSTS_PATH `
              -Image "${{ inputs.image }}" `
              -Revision "${{ inputs.revision }}"
      - name: Export non-secret deployment evidence
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ vars.K_COMMS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.K_COMMS_DEPLOY_USER }}
        run: |
          $evidencePath = Join-Path `
              $env:RUNNER_TEMP `
              "k-comms-${{ inputs.environment }}-${{ inputs.revision }}.json"
          & (
              Join-Path $env:GITHUB_WORKSPACE `
                  "scripts\proxmox\export-deployment-evidence.ps1"
          ) `
              -Environment "${{ inputs.environment }}" `
              -DeployHost $env:DEPLOY_HOST `
              -DeployUser $env:DEPLOY_USER `
              -SshKeyPath $env:DEPLOY_KEY_PATH `
              -KnownHostsPath $env:DEPLOY_KNOWN_HOSTS_PATH `
              -Revision "${{ inputs.revision }}" `
              -OutputPath $evidencePath
          "DEPLOYMENT_EVIDENCE_PATH=$evidencePath" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @"
          ### ${{ inputs.environment }} deployment evidence

          - Revision: ${{ inputs.revision }}
          - Image: ${{ inputs.image }}
          - Evidence artifact: k-comms-${{ inputs.environment }}-${{ inputs.revision }}-attempt-${{ github.run_attempt }}
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Retain deployment evidence with the workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k-comms-${{ inputs.environment }}-${{ inputs.revision }}-attempt-${{ github.run_attempt }}
          path: ${{ env.DEPLOYMENT_EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 90
      - name: Remove protected SSH inputs
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @(
              $env:DEPLOY_KEY_PATH,
              $env:DEPLOY_KNOWN_HOSTS_PATH,
              $env:LIVEKIT_CREDENTIAL_PATH
          )) {
              if ($path -and (Test-Path -LiteralPath $path)) {
                  if ($IsWindows) {
                      $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
                      & icacls.exe $path /inheritance:r /grant:r "$identity`:(F)" |
                          Out-Null
                      if ($LASTEXITCODE -ne 0) {
                          throw "Failed to authorize protected SSH input cleanup"
                      }
                  }
                  Remove-Item -LiteralPath $path -Force
              }
          }
