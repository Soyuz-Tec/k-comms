name: One-time recover Kayilan owner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-time-recover-kayilan-owner-production
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, x64, k-comms-deploy]
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reconfirm protected main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          $head = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()
          if ($head -ne $main -or $head -ne "${{ github.sha }}") {
              throw "Owner recovery must run from the current protected main"
          }

      - name: Materialize one-time protected inputs
        shell: pwsh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.K_COMMS_DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.K_COMMS_DEPLOY_HOST_KEY }}
          OWNER_PASSWORD: ${{ secrets.K_COMMS_ONE_TIME_OWNER_PASSWORD }}
        run: |
          $password = $env:OWNER_PASSWORD
          if (
              [string]::IsNullOrWhiteSpace($password) -or
              $password.Length -lt 12 -or
              $password.Length -gt 256 -or
              $password.Contains("`r") -or
              $password.Contains("`n") -or
              $password.Contains([char]0)
          ) {
              throw "The protected one-time owner password is invalid"
          }

          $keyPath = Join-Path $env:RUNNER_TEMP "k-comms-recovery-key"
          $knownHostsPath = Join-Path $env:RUNNER_TEMP "k-comms-recovery-known-hosts"
          $passwordPath = Join-Path $env:RUNNER_TEMP "k-comms-owner-recovery.env"

          [IO.File]::WriteAllText(
              $keyPath,
              $env:DEPLOY_SSH_KEY.Trim() + [Environment]::NewLine,
              [Text.UTF8Encoding]::new($false)
          )
          [IO.File]::WriteAllText(
              $knownHostsPath,
              $env:DEPLOY_HOST_KEY.Trim() + [Environment]::NewLine,
              [Text.UTF8Encoding]::new($false)
          )
          [IO.File]::WriteAllText(
              $passwordPath,
              "K_COMMS_ONE_TIME_OWNER_PASSWORD=$password" + [Environment]::NewLine,
              [Text.UTF8Encoding]::new($false)
          )

          foreach ($path in @($keyPath, $passwordPath)) {
              if ($IsWindows) {
                  $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
                  & icacls.exe $path /inheritance:r /grant:r "$identity`:(R)" |
                      Out-Null
                  if ($LASTEXITCODE -ne 0) {
                      throw "Failed to restrict a protected recovery input ACL"
                  }
              }
              else {
                  & chmod 0600 -- $path
                  if ($LASTEXITCODE -ne 0) {
                      throw "Failed to restrict a protected recovery input mode"
                  }
              }
          }

          "RECOVERY_KEY_PATH=$keyPath" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RECOVERY_KNOWN_HOSTS_PATH=$knownHostsPath" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RECOVERY_PASSWORD_PATH=$passwordPath" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reset the exact production owner credential
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ vars.K_COMMS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.K_COMMS_DEPLOY_USER }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          . (Join-Path $env:GITHUB_WORKSPACE "scripts/proxmox/native-command.ps1")
          $scp = Resolve-KCommsNativeCommand -Name "scp"
          $ssh = Resolve-KCommsNativeCommand -Name "ssh"
          $key = (Resolve-Path -LiteralPath $env:RECOVERY_KEY_PATH).Path
          $knownHosts = (Resolve-Path -LiteralPath $env:RECOVERY_KNOWN_HOSTS_PATH).Path
          $passwordFile = (Resolve-Path -LiteralPath $env:RECOVERY_PASSWORD_PATH).Path
          $target = "$env:DEPLOY_USER@$env:DEPLOY_HOST"
          $remotePassword = "/tmp/k-comms-one-time-owner-${{ github.run_id }}.env"

          $prepareCommand = "umask 077; : > '$remotePassword'; chmod 0600 '$remotePassword'"
          & $ssh `
              -i $key `
              -o BatchMode=yes `
              -o StrictHostKeyChecking=yes `
              -o "UserKnownHostsFile=$knownHosts" `
              $target `
              $prepareCommand
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to prepare the protected remote recovery input"
          }

          & $scp `
              -i $key `
              -o BatchMode=yes `
              -o StrictHostKeyChecking=yes `
              -o "UserKnownHostsFile=$knownHosts" `
              $passwordFile `
              "${target}:$remotePassword"
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to transfer the protected one-time password"
          }

          $remoteScript = @'
          set -Eeuo pipefail

          secret_path='@@REMOTE_PASSWORD@@'
          trap 'rm -f -- "$secret_path"' EXIT

          [[ "$secret_path" =~ ^/tmp/k-comms-one-time-owner-[0-9]+\.env$ ]]
          test -f "$secret_path"
          chmod 0600 "$secret_path"
          test "$(wc -l <"$secret_path")" -eq 1
          grep -Eq '^K_COMMS_ONE_TIME_OWNER_PASSWORD=.{12,256}$' "$secret_path"
          systemctl is-active --quiet k-comms-app.service
          podman container exists k-comms-app
          grep -qx 'K_COMMS_ENVIRONMENT=production' /etc/k-comms/environment

          eval_code="$(cat <<'ELIXIR'
          import Ecto.Query

          alias CommsCore.Accounts.{
            CallLifecycleCommand,
            CallLifecyclePort,
            Device,
            NotificationCommand,
            NotificationPort,
            PasswordRecoveryRequest,
            Session,
            User
          }

          alias CommsCore.Administration.Tenant
          alias CommsCore.Security.Password
          alias CommsCore.{Audit, Repo}

          tenant_slug = "kayilan"
          email = "cs@kayilan.com"
          password = System.fetch_env!("K_COMMS_ONE_TIME_OWNER_PASSWORD")

          unless Password.valid_password?(password) do
            raise "one-time password does not satisfy the K-Comms password policy"
          end

          Application.load(:comms_core)

          {:ok, result, _started_apps} =
            Ecto.Migrator.with_repo(Repo, fn _repo ->
              Repo.transaction(fn ->
              tenant =
                Repo.one(
                  from(t in Tenant,
                    where: t.slug == ^tenant_slug and t.status == :active,
                    lock: "FOR UPDATE"
                  )
                ) || Repo.rollback(:tenant_not_found)

              user =
                Repo.one(
                  from(u in User,
                    where:
                      u.tenant_id == ^tenant.id and
                        fragment("lower(?)", u.email) == ^email,
                    lock: "FOR UPDATE"
                  )
                ) || Repo.rollback(:owner_not_found)

              unless user.role == :owner and user.status == :active and
                       user.account_type == :human and user.access_scope == :workspace do
                Repo.rollback(:owner_identity_mismatch)
              end

              timestamp = DateTime.utc_now() |> DateTime.truncate(:microsecond)

              updated_user =
                user
                |> User.changeset(%{password_hash: Password.hash(password)})
                |> Ecto.Changeset.optimistic_lock(:lock_version)
                |> Repo.update()
                |> case do
                  {:ok, updated} -> updated
                  {:error, reason} -> Repo.rollback(reason)
                end

              active_sessions =
                from(s in Session,
                  where:
                    s.tenant_id == ^tenant.id and s.user_id == ^user.id and
                      is_nil(s.revoked_at)
                )

              {session_count, _} =
                Repo.update_all(active_sessions,
                  set: [revoked_at: timestamp, updated_at: timestamp]
                )

              {device_count, _} =
                from(d in Device,
                  where:
                    d.tenant_id == ^tenant.id and d.user_id == ^user.id and
                      is_nil(d.revoked_at)
                )
                |> Repo.update_all(set: [revoked_at: timestamp, updated_at: timestamp])

              {recovery_count, _} =
                from(r in PasswordRecoveryRequest,
                  where:
                    r.tenant_id == ^tenant.id and r.user_id == ^user.id and
                      is_nil(r.consumed_at) and is_nil(r.invalidated_at)
                )
                |> Repo.update_all(set: [invalidated_at: timestamp, updated_at: timestamp])

              NotificationCommand.user_access_revoked(
                tenant.id,
                user.id,
                "protected_owner_recovery"
              )
              |> NotificationPort.execute()
              |> case do
                :ok -> :ok
                {:ok, _receipt} -> :ok
                {:error, reason} -> Repo.rollback(reason)
              end

              CallLifecycleCommand.user_access_revoked(
                tenant.id,
                user.id,
                "protected_owner_recovery"
              )
              |> CallLifecyclePort.revoke_identity_access()
              |> case do
                {:ok, _receipt} -> :ok
                {:error, reason} -> Repo.rollback(reason)
              end

              Audit.record(%{
                tenant_id: tenant.id,
                actor_user_id: nil,
                action: "user.protected_owner_recovery",
                resource_type: "user",
                resource_id: user.id,
                metadata: %{
                  actor: "github_protected_environment",
                  reason: "recover requested Kayilan production owner access",
                  source: "one_time_workflow",
                  sessions_revoked: session_count,
                  devices_revoked: device_count,
                  recovery_requests_invalidated: recovery_count
                }
              })
              |> case do
                {:ok, _event} -> :ok
                {:error, reason} -> Repo.rollback(reason)
              end

                %{
                  user_id: updated_user.id,
                  role: updated_user.role,
                  sessions_revoked: session_count,
                  devices_revoked: device_count,
                  recovery_requests_invalidated: recovery_count
                }
              end)
            end)

          case result do
            {:ok, receipt} ->
              IO.puts(
                "OWNER_RECOVERY_OK user_id=#{receipt.user_id} role=#{receipt.role} " <>
                  "sessions_revoked=#{receipt.sessions_revoked} " <>
                  "devices_revoked=#{receipt.devices_revoked} " <>
                  "recovery_requests_invalidated=#{receipt.recovery_requests_invalidated}"
              )

            {:error, reason} ->
              raise "protected owner recovery failed: #{inspect(reason)}"
          end
          ELIXIR
          )"

          podman exec \
            --env-file "$secret_path" \
            --env K_COMMS_INSTANCE_ID=one-time-owner-recovery \
            --env K_COMMS_RUNTIME_PURPOSE=one_shot \
            --env K_COMMS_LOCAL_RELEASE=false \
            --env K_COMMS_RELEASE_EXPOSURE_MODE= \
            --env K_COMMS_TRUSTED_EDGE_CONFIRMATION= \
            --env ALLOW_BOOTSTRAP=false \
            k-comms-app \
            /usr/bin/env \
            -u K_COMMS_QUALIFICATION_APP_ORIGIN \
            -u K_COMMS_QUALIFICATION_APP_CONFIRMATION \
            -u K_COMMS_QUALIFICATION_SHARE_ORIGIN \
            /app/bin/k_comms eval "$eval_code"
          '@

          $remoteScript = $remoteScript.Replace("@@REMOTE_PASSWORD@@", $remotePassword)
          $remoteScript = $remoteScript.Replace("`r`n", "`n")
          $encoded = [Convert]::ToBase64String(
              [Text.Encoding]::UTF8.GetBytes($remoteScript)
          )
          $remoteCommand = "printf '%s' '$encoded' | base64 -d | sudo bash"

          $output = & $ssh `
              -i $key `
              -o BatchMode=yes `
              -o StrictHostKeyChecking=yes `
              -o "UserKnownHostsFile=$knownHosts" `
              $target `
              $remoteCommand
          if ($LASTEXITCODE -ne 0) {
              throw "Protected production owner recovery failed"
          }

          $receipt = ($output -join [Environment]::NewLine).Trim()
          if (
              $receipt -notmatch (
                  '^OWNER_RECOVERY_OK user_id=[0-9a-f-]{36} role=owner ' +
                  'sessions_revoked=[0-9]+ devices_revoked=[0-9]+ ' +
                  'recovery_requests_invalidated=[0-9]+$'
              )
          ) {
              throw "Protected production owner recovery returned an invalid receipt"
          }

          "### One-time Kayilan owner recovery" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '- Target: `kayilan / cs@kayilan.com`' |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '- Result: active owner password reset and prior access revoked' |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Remove the remote one-time password
        if: always()
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ vars.K_COMMS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.K_COMMS_DEPLOY_USER }}
        run: |
          if (
              $env:RECOVERY_KEY_PATH -and
              $env:RECOVERY_KNOWN_HOSTS_PATH -and
              (Test-Path -LiteralPath $env:RECOVERY_KEY_PATH) -and
              (Test-Path -LiteralPath $env:RECOVERY_KNOWN_HOSTS_PATH)
          ) {
              . (Join-Path $env:GITHUB_WORKSPACE "scripts/proxmox/native-command.ps1")
              $ssh = Resolve-KCommsNativeCommand -Name "ssh"
              $target = "$env:DEPLOY_USER@$env:DEPLOY_HOST"
              $remotePassword = "/tmp/k-comms-one-time-owner-${{ github.run_id }}.env"
              $cleanupCommand = "sudo -n rm -f -- '$remotePassword'"

              & $ssh `
                  -i $env:RECOVERY_KEY_PATH `
                  -o BatchMode=yes `
                  -o StrictHostKeyChecking=yes `
                  -o "UserKnownHostsFile=$env:RECOVERY_KNOWN_HOSTS_PATH" `
                  $target `
                  $cleanupCommand
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to remove the protected remote recovery input"
              }
          }

      - name: Remove protected recovery inputs
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @(
              $env:RECOVERY_KEY_PATH,
              $env:RECOVERY_KNOWN_HOSTS_PATH,
              $env:RECOVERY_PASSWORD_PATH
          )) {
              if ($path -and (Test-Path -LiteralPath $path)) {
                  if ($IsWindows) {
                      $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
                      & icacls.exe $path /inheritance:r /grant:r "$identity`:(F)" |
                          Out-Null
                      if ($LASTEXITCODE -ne 0) {
                          throw "Failed to authorize protected recovery input cleanup"
                      }
                  }
                  Remove-Item -LiteralPath $path -Force
              }
          }
