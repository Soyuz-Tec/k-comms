name: Container

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - Dockerfile
      - compose.yaml
      - mix.exs
      - mix.lock
      - "apps/**"
      - "clients/web/**"
      - "config/**"
      - "deploy/proxmox/**"
      - "scripts/container_smoke.sh"
      - "scripts/proxmox/**"
      - "scripts/validate_proxmox_bundle.py"
      - "scripts/test_validate_proxmox_bundle.py"
      - "scripts/validate_compose_exposure.py"
      - "scripts/test_validate_compose_exposure.py"
      - ".github/workflows/container.yml"
      - ".github/workflows/deploy-proxmox.yml"
      # Test sources cannot reach the runtime artifact, so a test-only commit
      # must not publish a digest, occupy the serialized release chain, or ask
      # an authorized reviewer to approve a production deployment that changes
      # nothing. Every app sets elixirc_paths to ["lib"] outside :test, so the
      # prod release never compiles test/, and the built web bundle carries no
      # vitest, testing-library, or Playwright code.
      #
      # These exclusions must remain last: the final matching pattern decides a
      # path, so a positive pattern added below them would silently re-include
      # what they exclude. The scripts/test_validate_*.py entries above are
      # deliberately not excluded -- those run inside this workflow.
      #
      # No gate is weakened. ci.yml carries no path filter, so the Elixir
      # suite, Vitest, and the Playwright matrix still run on every change, and
      # the unfiltered pull_request trigger still builds and smoke-tests the
      # image for a test-only pull request.
      - "!apps/*/test/**"
      - "!clients/web/e2e/**"
      - "!clients/web/src/test/**"
      - "!clients/web/src/**/*.test.ts"
      - "!clients/web/src/**/*.test.tsx"
  workflow_dispatch:

permissions:
  attestations: read
  contents: read
  packages: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify runtime impact
        id: runtime_impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          runtime_required=false

          while IFS= read -r path; do
            case "$path" in
              .dockerignore|Dockerfile|compose.yaml|mix.exs|mix.lock|\
              apps/*|clients/web/*|config/*|deploy/k8s/*|deploy/proxmox/*|\
              scripts/container_smoke.sh|\
              scripts/proxmox/*|\
              scripts/validate_proxmox_bundle.py|\
              scripts/test_validate_proxmox_bundle.py|\
              scripts/validate_compose_exposure.py|\
              scripts/test_validate_compose_exposure.py|\
              .github/workflows/container.yml|\
              .github/workflows/deploy-proxmox.yml)
                runtime_required=true
                break
                ;;
            esac
          done < <(git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA")

          echo "required=$runtime_required" >> "$GITHUB_OUTPUT"
          if [[ "$runtime_required" == "true" ]]; then
            echo "Runtime-impacting paths changed; full container smoke is required." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No runtime-impacting paths changed; the required smoke sentinel passes." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate local Compose exposure policy
        if: steps.runtime_impact.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_validate_compose_exposure.py
          python scripts/validate_compose_exposure.py
      - name: Build, migrate, boot, and smoke the runtime image
        if: steps.runtime_impact.outputs.required == 'true'
        shell: bash
        env:
          CONTAINER_ENGINE: docker
          IMAGE: k-comms:ci
          OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          OCI_REVISION: ${{ github.sha }}
          OCI_VERSION: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
        run: bash scripts/container_smoke.sh

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      TRIVY_IMAGE: docker.io/aquasec/trivy:0.72.0@sha256:c6e969c5662a546ad5de4a73c2a6b7a7c627f86d916903e175aa623af5b97ada
    outputs:
      image: ${{ steps.release.outputs.image }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate local Compose exposure policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_validate_compose_exposure.py
          python scripts/validate_compose_exposure.py
      - name: Define immutable image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA}"
          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
          echo "image=${repository}:${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Build, migrate, boot, and smoke the exact publication image
        shell: bash
        env:
          CONTAINER_ENGINE: docker
          IMAGE: ${{ steps.image.outputs.image }}
          OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          OCI_REVISION: ${{ github.sha }}
          OCI_VERSION: ${{ steps.image.outputs.version }}
        run: bash scripts/container_smoke.sh
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image and capture registry digest
        id: push
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          push_log="${RUNNER_TEMP}/k-comms-container-push.log"
          docker push "${IMAGE}" 2>&1 | tee "${push_log}"
          digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "${push_log}" | tail -n 1)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "docker push did not return a valid sha256 digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Published ${IMAGE}@${digest}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Generate CycloneDX SBOM for the publication image
        id: sbom
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/k-comms-publication.tar"
          sbom_path="${RUNNER_TEMP}/k-comms-${GITHUB_SHA}.cdx.json"
          trap 'rm -f "${archive}"' EXIT

          docker save --output "${archive}" "${IMAGE}"
          docker run --rm \
            --volume "${RUNNER_TEMP}:/scan" \
            "${TRIVY_IMAGE}" image \
            --input "/scan/$(basename "${archive}")" \
            --scanners vuln \
            --format cyclonedx \
            --output "/scan/$(basename "${sbom_path}")" \
            --skip-version-check

          SBOM_PATH="${sbom_path}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["SBOM_PATH"])
          document = json.loads(path.read_text(encoding="utf-8"))
          if document.get("bomFormat") != "CycloneDX":
              raise SystemExit("Trivy output is not a CycloneDX SBOM")
          if not document.get("serialNumber") or not document.get("specVersion"):
              raise SystemExit("CycloneDX identity fields are missing")
          if not document.get("components"):
              raise SystemExit("CycloneDX SBOM contains no components")
          PY

          echo "path=${sbom_path}" >> "${GITHUB_OUTPUT}"
          echo "CycloneDX SBOM: $(sha256sum "${sbom_path}" | cut -d' ' -f1)" >> "${GITHUB_STEP_SUMMARY}"
      - name: Retain CycloneDX SBOM with the workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k-comms-sbom-${{ github.sha }}
          path: ${{ steps.sbom.outputs.path }}
          if-no-files-found: error
          retention-days: 90
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ steps.sbom.outputs.path }}
          push-to-registry: true
      - name: Record the only promotable release candidate
        id: release
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          set -euo pipefail
          image="${REPOSITORY}@${DIGEST}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "### Immutable release candidate"
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Image: \`${image}\`"
            echo "- Next: protected staging qualification, then protected production"
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Qualify the immutable release in staging
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.publish.result == 'success'
    needs: publish
    uses: ./.github/workflows/deploy-proxmox.yml
    with:
      environment: staging
      image: ${{ needs.publish.outputs.image }}
      revision: ${{ needs.publish.outputs.revision }}
      bootstrap: true
    secrets: inherit

  production:
    name: Promote the staging-qualified release to production
    needs: [publish, staging]
    uses: ./.github/workflows/deploy-proxmox.yml
    with:
      environment: production
      image: ${{ needs.publish.outputs.image }}
      revision: ${{ needs.publish.outputs.revision }}
      bootstrap: false
    secrets: inherit

  verify-public-production:
    name: Verify public production and finalize release evidence
    needs: [publish, staging, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify every configured public production endpoint
        shell: bash
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          REVISION: ${{ needs.publish.outputs.revision }}
        run: |
          set -euo pipefail
          curl_checked() {
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              "$1"
          }

          app_status="$(curl_checked https://comms.avayaworks.com/api/v1/status)"
          root_status="$(curl_checked https://avayaworks.com/api/v1/status)"
          app_readiness="$(curl_checked https://comms.avayaworks.com/health/ready)"
          root_readiness="$(curl_checked https://avayaworks.com/health/ready)"
          curl_checked https://media.avayaworks.com >/dev/null
          curl_checked \
            https://kcomms-files.avayaworks.com/minio/health/ready \
            >/dev/null

          pwa_worker_status="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              --max-redirs 0 \
              --dump-header pwa-worker.headers \
              --output pwa-worker.js \
              --write-out '%{http_code}' \
              "https://comms.avayaworks.com/app/k-comms-sw.js?revision=${REVISION}"
          )"
          test "$pwa_worker_status" = "200"
          pwa_worker_headers="$(tr -d '\r' < pwa-worker.headers)"
          pwa_worker_headers_lower="${pwa_worker_headers,,}"
          grep -Fqx \
            "cache-control: no-store, max-age=0, must-revalidate" \
            <<<"$pwa_worker_headers_lower"
          grep -Fqx "service-worker-allowed: /app/" \
            <<<"$pwa_worker_headers_lower"
          cf_cache_status="$(
            sed -n 's/^cf-cache-status: //p' \
              <<<"$pwa_worker_headers_lower" |
              tail -n 1
          )"
          case "$cf_cache_status" in
            ""|bypass|dynamic) ;;
            *)
              echo "service worker was eligible for or served from edge cache: ${cf_cache_status}" >&2
              exit 1
              ;;
          esac
          grep -Fq "$REVISION" pwa-worker.js

          pwa_manifest_headers="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              --dump-header - \
              --output pwa-manifest.webmanifest \
              https://comms.avayaworks.com/app/manifest.webmanifest |
              tr -d '\r'
          )"
          pwa_manifest_headers_lower="${pwa_manifest_headers,,}"
          grep -Fqx \
            "cache-control: no-cache, max-age=0, must-revalidate" \
            <<<"$pwa_manifest_headers_lower"
          grep -Eq '^content-type: application/manifest\+json' \
            <<<"$pwa_manifest_headers_lower"
          jq -e '
            .id == "/" and
            .start_url == "/app/" and
            .scope == "/" and
            .display == "standalone" and
            .prefer_related_applications == false
          ' pwa-manifest.webmanifest >/dev/null
          curl_checked https://comms.avayaworks.com/app/offline.html |
            grep -Fq "K-Comms is offline"
          for icon in \
            pwa-192.png \
            pwa-512.png \
            pwa-maskable-512.png \
            apple-touch-icon.png; do
            curl_checked \
              "https://comms.avayaworks.com/app/icons/${icon}" \
              >/dev/null
          done

          pwa_index_headers="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              --dump-header - \
              --output pwa-index.html \
              https://comms.avayaworks.com/app/ |
              tr -d '\r'
          )"
          grep -Fqx \
            "cache-control: no-store, max-age=0, must-revalidate" \
            <<<"${pwa_index_headers,,}"
          pwa_asset_path="$(
            grep -Eo \
              '(/app/|\./)assets/[^"[:space:]]+\.(js|css)' \
              pwa-index.html |
              awk 'NR == 1 {print}'
          )"
          test -n "$pwa_asset_path"
          if [[ "$pwa_asset_path" == ./* ]]; then
            pwa_asset_path="/app/${pwa_asset_path#./}"
          fi
          if ! grep -Eq \
            '^/app/assets/[A-Za-z0-9._-]+-[A-Za-z0-9_-]{8,}\.(js|css)$' \
            <<<"$pwa_asset_path"; then
            echo "Public PWA asset is not content-revisioned: $pwa_asset_path" >&2
            exit 1
          fi
          pwa_asset_headers="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              --dump-header - \
              --output pwa-asset.body \
              "https://comms.avayaworks.com${pwa_asset_path}" |
              tr -d '\r'
          )"
          pwa_asset_headers_lower="${pwa_asset_headers,,}"
          grep -Fqx \
            "cache-control: public, max-age=31536000, immutable" \
            <<<"$pwa_asset_headers_lower"
          if [[ "$pwa_asset_path" == *.js ]]; then
            grep -Eq '^content-type: (text|application)/javascript' \
              <<<"$pwa_asset_headers_lower"
          else
            grep -Eq '^content-type: text/css' \
              <<<"$pwa_asset_headers_lower"
          fi
          test -s pwa-asset.body

          missing_status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              --dump-header pwa-missing.headers \
              --output pwa-missing.body \
              --write-out '%{http_code}' \
              https://comms.avayaworks.com/app/assets/missing-A1b2C3d4.js
          )"
          test "$missing_status" = "404"
          tr -d '\r' < pwa-missing.headers |
            tr '[:upper:]' '[:lower:]' > pwa-missing.headers.lower
          grep -Eq '^content-type: text/plain' pwa-missing.headers.lower
          grep -Fqx \
            "cache-control: no-store, max-age=0, must-revalidate" \
            pwa-missing.headers.lower
          grep -Fq "Static application asset not found" pwa-missing.body

          for document in \
            "$app_status" \
            "$root_status"; do
            jq -e '
              .status == "operational" and
              .service == "k-comms"
            ' <<<"$document" >/dev/null
          done
          for document in \
            "$app_readiness" \
            "$root_readiness"; do
            jq -e '
              .status == "ready" and
              .checks.runtime.status == "ok" and
              .checks.database.status == "ok" and
              .checks.object_storage.status == "configured"
            ' <<<"$document" >/dev/null
          done

          {
            echo "### Production release completed"
            echo
            echo "- Revision: \`${REVISION}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Staging: deployment, backup, rollback, reactivation, and isolated restore passed"
            echo "- Production: protected approval, backup, same-digest deployment, and host verification passed"
            echo "- Public application, media, and object-storage endpoints passed"
            echo "- Evidence artifacts: \`k-comms-staging-${REVISION}\`, \`k-comms-production-${REVISION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
