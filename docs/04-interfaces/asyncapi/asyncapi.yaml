asyncapi: 3.0.0
info:
  title: K-Comms Realtime Protocol
  version: 0.3.0
  description: Phoenix Channel commands and tenant-authorized events connected with a short-lived, one-time socket ticket minted over authenticated HTTPS. Human tickets may join authorized member topics; guest tickets may join only the conversation fixed by their active guest admission.
defaultContentType: application/json
channels:
  conversation:
    address: conversation:{conversationId}
    parameters:
      conversationId:
        description: Conversation UUID authorized at join and for every command; a guest ticket must match its one admitted conversation.
    messages:
      command:
        $ref: '#/components/messages/Command'
      messageCreated:
        $ref: '#/components/messages/MessageCreated'
      messageUpdated:
        $ref: '#/components/messages/MessageUpdated'
      messageDeleted:
        $ref: '#/components/messages/MessageDeleted'
      reactionAdded:
        $ref: '#/components/messages/ReactionAdded'
      reactionRemoved:
        $ref: '#/components/messages/ReactionRemoved'
      readCursor:
        $ref: '#/components/messages/ReadCursor'
      membershipChanged:
        $ref: '#/components/messages/MembershipChanged'
      typing:
        $ref: '#/components/messages/Typing'
      presenceState:
        $ref: '#/components/messages/PresenceState'
      presenceDiff:
        $ref: '#/components/messages/PresenceDiff'
      callStarted:
        $ref: '#/components/messages/CallStarted'
      callEnded:
        $ref: '#/components/messages/CallEnded'
      audioCallStarted:
        $ref: '#/components/messages/AudioCallStarted'
      audioCallEnded:
        $ref: '#/components/messages/AudioCallEnded'
  whiteboard:
    address: whiteboard:{conversationId}
    description: Active workspace-human or scoped instant-room participant topic for durable whiteboard commit signals and ephemeral collaborator presence. Ordinary conversation guest links remain denied. Authorization is repeated for every inbound and intercepted outbound event.
    parameters:
      conversationId:
        description: Conversation UUID authorized at join and on every event
    messages:
      operationApplied:
        $ref: '#/components/messages/WhiteboardOperationApplied'
      presenceCommand:
        $ref: '#/components/messages/WhiteboardPresenceCommand'
      presence:
        $ref: '#/components/messages/WhiteboardPresence'
  userInbox:
    address: user:{userId}
    description: Human-account-only content-free conversation-list, membership, and notification-availability events; guest sockets cannot join this channel and a human socket may join only its own user id.
    parameters:
      userId:
        description: Authenticated user UUID, equal to the socket identity
    messages:
      conversationActivity:
        $ref: '#/components/messages/ConversationActivity'
      conversationMembership:
        $ref: '#/components/messages/ConversationMembership'
      notificationAvailable:
        $ref: '#/components/messages/NotificationAvailable'
operations:
  sendConversationCommand:
    action: send
    channel: {$ref: '#/channels/conversation'}
    messages:
      - {$ref: '#/channels/conversation/messages/command'}
  receiveConversationEvent:
    action: receive
    channel: {$ref: '#/channels/conversation'}
    messages:
      - {$ref: '#/channels/conversation/messages/messageCreated'}
      - {$ref: '#/channels/conversation/messages/messageUpdated'}
      - {$ref: '#/channels/conversation/messages/messageDeleted'}
      - {$ref: '#/channels/conversation/messages/reactionAdded'}
      - {$ref: '#/channels/conversation/messages/reactionRemoved'}
      - {$ref: '#/channels/conversation/messages/readCursor'}
      - {$ref: '#/channels/conversation/messages/membershipChanged'}
      - {$ref: '#/channels/conversation/messages/typing'}
      - {$ref: '#/channels/conversation/messages/presenceState'}
      - {$ref: '#/channels/conversation/messages/presenceDiff'}
      - {$ref: '#/channels/conversation/messages/callStarted'}
      - {$ref: '#/channels/conversation/messages/callEnded'}
      - {$ref: '#/channels/conversation/messages/audioCallStarted'}
      - {$ref: '#/channels/conversation/messages/audioCallEnded'}
  sendWhiteboardPresence:
    action: send
    channel: {$ref: '#/channels/whiteboard'}
    messages:
      - {$ref: '#/channels/whiteboard/messages/presenceCommand'}
  receiveWhiteboardEvent:
    action: receive
    channel: {$ref: '#/channels/whiteboard'}
    messages:
      - {$ref: '#/channels/whiteboard/messages/operationApplied'}
      - {$ref: '#/channels/whiteboard/messages/presence'}
  receiveUserInboxEvent:
    action: receive
    channel: {$ref: '#/channels/userInbox'}
    messages:
      - {$ref: '#/channels/userInbox/messages/conversationActivity'}
      - {$ref: '#/channels/userInbox/messages/conversationMembership'}
      - {$ref: '#/channels/userInbox/messages/notificationAvailable'}
components:
  messages:
    Command:
      name: command
      payload:
        type: object
        additionalProperties: false
        required: [command_id, type, payload]
        properties:
          command_id: {type: string, minLength: 8, maxLength: 128}
          type:
            enum: [message.send.v1, conversation.read.v1, typing.start.v1, typing.stop.v1]
          payload: {type: object}
          client_time: {type: [string, 'null'], format: date-time}
    MessageCreated:
      name: message.created.v1
      payload:
        $ref: ../json-schema/message-created.v1.json
    MessageUpdated:
      name: message.updated.v1
      payload:
        $ref: ../json-schema/message-created.v1.json
    MessageDeleted:
      name: message.deleted.v1
      payload:
        $ref: ../json-schema/message-created.v1.json
    ReactionAdded:
      name: message.reaction_added.v1
      payload:
        type: object
        required: [message_id, user_id, emoji]
        properties:
          message_id: {type: string, format: uuid}
          user_id: {type: string, format: uuid}
          emoji: {type: string, minLength: 1, maxLength: 32}
    ReactionRemoved:
      name: message.reaction_removed.v1
      payload:
        type: object
        required: [message_id, user_id, emoji]
        properties:
          message_id: {type: string, format: uuid}
          user_id: {type: string, format: uuid}
          emoji: {type: string, minLength: 1, maxLength: 32}
    ReadCursor:
      name: conversation.read.v1
      payload:
        type: object
        required: [user_id, sequence]
        properties:
          user_id: {type: string, format: uuid}
          sequence: {type: integer, minimum: 0}
    MembershipChanged:
      name: membership.changed.v1
      description: Content-free membership delta emitted after committed administrative, self-service public-channel, or guest-link admission changes; no link token or digest is present.
      payload:
        type: object
        additionalProperties: false
        required: [user_id, action]
        properties:
          user_id: {type: string, format: uuid}
          action: {enum: [added, removed, role_changed]}
          role: {enum: [member, moderator, owner]}
          version: {type: integer, minimum: 1}
          source: {enum: [administrative, self_service, guest_link]}
    Typing:
      name: typing.v1
      payload:
        type: object
        required: [user_id, state]
        properties:
          user_id: {type: string, format: uuid}
          state: {enum: [started, stopped]}
    PresenceState:
      name: presence_state
      description: Full Phoenix Presence state after authorized join. Object keys are user UUIDs. Application metadata contains only account_type and online_at; Phoenix may add opaque phx_ref transport fields required for Presence diff reconciliation.
      payload:
        $ref: '#/components/schemas/PresenceStatePayload'
    PresenceDiff:
      name: presence_diff
      description: Eventually consistent Phoenix Presence delta. Application metadata remains limited to account_type and online_at; opaque phx_ref transport fields are not domain connection identifiers. Durable ephemeral-room leases, not this payload, remain lifecycle authority.
      payload:
        $ref: '#/components/schemas/PresenceDiffPayload'
    CallStarted:
      name: call.started.v1
      description: Canonical audio/video call-start signal emitted on the authorized conversation topic. Active guest admissions receive the same event after per-event authorization.
      payload:
        $ref: '#/components/schemas/CallStartedPayload'
    CallEnded:
      name: call.ended.v1
      description: Canonical audio/video call-end signal emitted on the authorized conversation topic. Active guest admissions receive the same event after per-event authorization.
      payload:
        $ref: '#/components/schemas/CallEndedPayload'
    AudioCallStarted:
      name: audio_call.started.v1
      description: Audio-only compatibility alias emitted alongside call.started.v1; new clients should consume the canonical call event.
      payload:
        $ref: '#/components/schemas/AudioCallStartedPayload'
    AudioCallEnded:
      name: audio_call.ended.v1
      description: Audio-only compatibility alias emitted alongside call.ended.v1; new clients should consume the canonical call event.
      payload:
        $ref: '#/components/schemas/AudioCallEndedPayload'
    WhiteboardOperationApplied:
      name: whiteboard.operation_applied.v1
      description: Post-commit durable operation signal. Clients reconcile canonical history over REST after gaps or reconnects.
      payload:
        $ref: '#/components/schemas/WhiteboardOperationPayload'
    WhiteboardPresenceCommand:
      name: whiteboard.presence.v1
      description: Ephemeral bounded pointer state sent by one authorized collaborator.
      payload:
        $ref: '#/components/schemas/WhiteboardPresenceCommandPayload'
    WhiteboardPresence:
      name: whiteboard.presence.v1
      description: Ephemeral bounded pointer state delivered only to other currently authorized collaborators.
      payload:
        $ref: '#/components/schemas/WhiteboardPresencePayload'
    ConversationActivity:
      name: conversation.activity.v1
      payload:
        type: object
        additionalProperties: false
        required: [conversation_id, latest_sequence, event_type]
        properties:
          conversation_id: {type: string, format: uuid}
          latest_sequence: {type: integer, minimum: 1}
          event_type:
            enum: [message.created.v1, message.updated.v1, message.deleted.v1]
    ConversationMembership:
      name: conversation.membership.v1
      description: Content-free signal for refreshing the authenticated user's conversation and public-channel lists.
      payload:
        type: object
        additionalProperties: false
        required: [conversation_id, action]
        properties:
          conversation_id: {type: string, format: uuid}
          action: {enum: [added, removed]}
    NotificationAvailable:
      name: notification.available.v1
      description: Content-free signal instructing the authenticated client to reconcile its durable in-app notification state over REST.
      payload:
        type: object
        additionalProperties: false
        required: [notification_id, event_type, unread_count]
        properties:
          notification_id: {type: string, format: uuid}
          event_type: {type: string, minLength: 1, maxLength: 120}
          conversation_id: {type: [string, 'null'], format: uuid}
          message_id: {type: [string, 'null'], format: uuid}
          unread_count: {type: integer, minimum: 0}
  schemas:
    WhiteboardPointer:
      type: object
      additionalProperties: false
      required: [x, y, tool]
      properties:
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        tool: {enum: [pointer, laser]}
    WhiteboardPresenceCommandPayload:
      type: object
      additionalProperties: false
      required: [pointer, button, selected_element_ids]
      properties:
        pointer: {$ref: '#/components/schemas/WhiteboardPointer'}
        button: {enum: [up, down]}
        selected_element_ids:
          type: array
          maxItems: 100
          items: {type: string, minLength: 8, maxLength: 128}
    WhiteboardPresencePayload:
      type: object
      additionalProperties: false
      required: [user_id, device_id, pointer, button, selected_element_ids]
      properties:
        user_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        pointer: {$ref: '#/components/schemas/WhiteboardPointer'}
        button: {type: boolean}
        selected_element_ids:
          type: array
          maxItems: 100
          items: {type: string, minLength: 8, maxLength: 128}
    WhiteboardElementPayload:
      type: object
      required: [id, type, version, versionNonce]
      properties:
        id: {type: string, minLength: 8, maxLength: 128}
        type: {enum: [rectangle, diamond, ellipse, line, arrow, freedraw, text, frame]}
        version: {type: integer, minimum: 1}
        versionNonce: {type: integer}
        link: {type: 'null'}
        customData: {type: 'null'}
      additionalProperties: true
    WhiteboardOperationPayload:
      type: object
      additionalProperties: false
      required: [id, whiteboard_id, tenant_id, conversation_id, actor_user_id, client_operation_id, sequence, kind, payload, inserted_at]
      properties:
        id: {type: string, format: uuid}
        whiteboard_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        actor_user_id: {type: string, format: uuid}
        client_operation_id: {type: string, minLength: 8, maxLength: 128}
        sequence: {type: integer, minimum: 1}
        kind: {enum: [scene.update, board.clear]}
        payload:
          type: object
          properties:
            elements:
              type: array
              minItems: 1
              maxItems: 200
              items: {$ref: '#/components/schemas/WhiteboardElementPayload'}
          additionalProperties: false
        inserted_at: {type: string, format: date-time}
    PresenceMeta:
      type: object
      additionalProperties: false
      required: [account_type, online_at]
      properties:
        account_type: {enum: [human, guest]}
        online_at:
          type: integer
          format: int64
          minimum: 0
          description: Unix epoch seconds supplied by the server.
        phx_ref:
          type: string
          minLength: 1
          maxLength: 255
          description: Opaque Phoenix Presence transport reference; clients must not interpret, persist, log, or use it as a domain connection identifier.
        phx_ref_prev:
          type: string
          minLength: 1
          maxLength: 255
          description: Opaque prior Phoenix Presence transport reference used only for diff reconciliation.
    PresenceEntry:
      type: object
      additionalProperties: false
      required: [metas]
      properties:
        metas:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PresenceMeta'}
    PresenceStatePayload:
      type: object
      description: Map whose property names are authorized user UUIDs.
      propertyNames: {type: string, format: uuid}
      additionalProperties: {$ref: '#/components/schemas/PresenceEntry'}
    PresenceDiffPayload:
      type: object
      additionalProperties: false
      required: [joins, leaves]
      properties:
        joins: {$ref: '#/components/schemas/PresenceStatePayload'}
        leaves: {$ref: '#/components/schemas/PresenceStatePayload'}
    CallStartedPayload:
      type: object
      additionalProperties: false
      required: [id, conversation_id, media_kind, started_by_user_id, status, started_at, expires_at, ended_by_user_id, ended_at, end_reason]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        media_kind: {enum: [audio, video]}
        started_by_user_id: {type: string, format: uuid}
        status: {const: active}
        started_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        ended_by_user_id: {type: 'null'}
        ended_at: {type: 'null'}
        end_reason: {type: 'null'}
    CallEndedPayload:
      type: object
      additionalProperties: false
      required: [id, conversation_id, media_kind, started_by_user_id, status, started_at, expires_at, ended_by_user_id, ended_at, end_reason]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        media_kind: {enum: [audio, video]}
        started_by_user_id: {type: string, format: uuid}
        status: {const: ended}
        started_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        ended_by_user_id: {type: [string, 'null'], format: uuid}
        ended_at: {type: string, format: date-time}
        end_reason: {type: string, minLength: 3, maxLength: 120}
    AudioCallStartedPayload:
      allOf:
        - {$ref: '#/components/schemas/CallStartedPayload'}
        - type: object
          properties:
            media_kind: {const: audio}
    AudioCallEndedPayload:
      allOf:
        - {$ref: '#/components/schemas/CallEndedPayload'}
        - type: object
          properties:
            media_kind: {const: audio}
