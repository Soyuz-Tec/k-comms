      tags: [Telephony]
      operationId: getTelephonyCall
      summary: Read an owned phone call and current device action permissions
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Authorized individual call record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelephonyCallResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/telephony/calls/{callId}/answer:
    parameters:
      - $ref: '#/components/parameters/AudioCallId'
    post:
      tags: [Telephony]
      operationId: answerTelephonyCall
      summary: Atomically claim an incoming call for the current session and device
      description: Only one device wins. Other devices receive a conflict and cannot acquire a room token. Admission alone keeps the record ringing until provider reconciliation observes the exact SIP participant active. Call duration begins at that observed SIP answer and excludes the ringing interval.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Claimed incoming call and device-bound media credential; answered state awaits exact SIP-active evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelephonyCallCredentialResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '426': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/telephony/calls/{callId}/reject:
    parameters:
      - $ref: '#/components/parameters/AudioCallId'
    post:
      tags: [Telephony]
      operationId: rejectTelephonyCall
      summary: Decline a ringing incoming call and durably request provider teardown
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Declined call record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelephonyCallResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/telephony/calls/{callId}/end:
    parameters:
      - $ref: '#/components/parameters/AudioCallId'
    post:
      tags: [Telephony]
      operationId: endTelephonyCall
      summary: Cancel an outbound attempt or end an answered call
      description: Terminal state is durable before provider teardown. A repeated end request preserves the terminal record and cannot add connected duration twice.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Terminal owned phone call record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelephonyCallResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/telephony/calls/{callId}/join:
    parameters:
      - $ref: '#/components/parameters/AudioCallId'
    post:
      tags: [Telephony]
      operationId: joinTelephonyCall
      summary: Refresh media admission for the device that owns the active call
      description: This action cannot answer a call on another device, admit an unassigned user, or reopen a terminal call. Every credential request rechecks current identity, session, device, and phone assignment.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Active call and a fresh short-lived media credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelephonyCallCredentialResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '426': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/telephony/livekit/webhook:
    post:
      tags: [Telephony, Integrations]
      operationId: receiveLiveKitTelephonyEvent
      summary: Receive a body-bound authenticated LiveKit telephony event
      description: Verify the LiveKit HS256 JWT, issuer, expiration, and SHA-256 of the exact raw request bytes before trusting parsed fields or mutating state. Known trunk, number, SIP participant, and isolated room mappings constrain attribution. Duplicate verified events are harmless; unmatched events cannot create arbitrary tenant calls. Generic media events do not prove a SIP answer.
      security: [{livekitWebhookAuth: []}]
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema: {type: object, additionalProperties: true}
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: 'Verified event accepted, ignored, or already processed'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '413':
          description: Webhook exceeds the 262144-byte limit and is rejected before JSON parsing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelephonyPayloadTooLargeResponse'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
