  /api/v1/search:
    get:
      tags: [Messages]
      operationId: searchMessages
      security: [{bearerAuth: []}]
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          description: Opaque continuation cursor returned by the previous search page
          schema: {type: string}
        - name: conversation_id
          in: query
          description: Restrict matches to one conversation the current user may read
          schema: {type: string, format: uuid}
        - name: sender_user_id
          in: query
          description: Restrict matches to messages sent by this tenant user
          schema: {type: string, format: uuid}
        - name: after
          in: query
          description: Inclusive lower bound for message creation time
          schema: {type: string, format: date-time}
        - name: before
          in: query
          description: Exclusive upper bound for message creation time
          schema: {type: string, format: date-time}
        - name: include
          in: query
          description: Opt in to privacy-minimal labels for senders referenced by this authorized result page
          schema: {type: string, enum: [sender_labels]}
      responses:
        '200':
          description: Membership-filtered message matches with an opaque continuation cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageSearchPage'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/files:
