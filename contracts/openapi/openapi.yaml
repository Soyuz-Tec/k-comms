        - name: request_id
          in: query
          schema: {type: string, maxLength: 200}
        - name: after
          in: query
          schema: {type: string, format: date-time}
        - name: before
          in: query
          description: Exclusive ISO date-time upper boundary; legacy opaque cursor values are also accepted
          schema: {type: string}
        - name: cursor
          in: query
          description: Opaque continuation cursor; combined with before using the earlier boundary
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Redacted tenant privileged audit events in descending timestamp and ID order
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: {type: array, items: {type: object}}
                  page:
                    type: object
                    required: [limit, next_cursor]
                    properties:
                      limit: {type: integer, minimum: 1, maximum: 100}
                      next_cursor:
                        type: [string, 'null']
                        description: Null when no further matching page exists
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
