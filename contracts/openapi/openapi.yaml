      security: [{bearerAuth: []}]
      parameters:
        - name: scope
          in: query
          schema: {enum: [recent, shared_by_me], default: recent}
        - name: conversation_id
          in: query
          description: Restrict results to one actively joined conversation
          schema: {type: string, format: uuid}
        - name: q
          in: query
          description: Trimmed literal filename search; case-insensitive and applied before pagination
          schema: {type: string, minLength: 2, maxLength: 160}
        - name: category
          in: query
          description: MIME category applied before pagination; omit for all files
          schema: {type: string, enum: [images, non_images]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
        - name: cursor
          in: query
          description: Opaque continuation cursor returned by the previous page
          schema: {type: string}
      responses:
        '200':
          description: Bounded authorized file page without storage identity, checksum, or download URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FilePage'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
