          minimum: 1
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeletionHistoryCoverage:
      type: object
      additionalProperties: false
      required:
      - state
      - retained_only
      - version_lineage
      - origin_present
      - earliest_at
      - snapshot_truncated
      - captured_count
      - retained_count
      - maximum_events
      properties:
        state:
          type: string
          enum:
          - available
          - partial
          - unavailable
        retained_only:
          const: true
        version_lineage:
          const: unproven
        origin_present:
          type: boolean
        earliest_at:
          type:
          - string
          - 'null'
          format: date-time
        snapshot_truncated:
          type: boolean
        captured_count:
          type: integer
          minimum: 0
          maximum: 5000
        retained_count:
          type: integer
          minimum: 0
          maximum: 5000
        maximum_events:
          const: 5000
    DeletionRequestTimeline:
      type: object
      additionalProperties: false
      required:
      - request
      - events
      - limit
      - next_cursor
      - snapshot
      - observed_at
      - snapshot_observed_at
      - coverage
      properties:
        request:
          $ref: '#/components/schemas/DeletionHistoryRequest'
        events:
          type: array
          items:
            $ref: '#/components/schemas/DeletionHistoryEvent'
          minItems: 0
          maxItems: 50
        limit:
          type: integer
          minimum: 1
          maximum: 50
        next_cursor:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 12000
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43}$
          description: Opaque one-hour signed position bound to the current tenant, exact deletion request and retained
            Audit snapshot. A snapshot is not a cursor; neither grants access.
        snapshot:
          type: string
          minLength: 1
          maxLength: 12000
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43}$
          description: Opaque one-hour signed position bound to the current tenant, exact deletion request and retained
            Audit snapshot. A snapshot is not a cursor; neither grants access.
        observed_at:
          type: string
          format: date-time
        snapshot_observed_at:
          type: string
          format: date-time
        coverage:
          $ref: '#/components/schemas/DeletionHistoryCoverage'
      description: Chronological retained lifecycle facts ordered by timestamp then event UUID. Coverage describes captured/retained
        sources, not proof of complete transition lineage. Request state and actor labels are current authorized projections;
        arbitrary Audit metadata, worker errors and raw evidence are excluded.
    DeletionRequestTimelineResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/DeletionRequestTimeline'
    ArtifactSummaryView:
      type: object
      additionalProperties: false
      required:
      - method
      - text
      - source_artifact_id
      - source_sha256
      - summary_sha256
      - policy_version
      properties:
        method:
          const: extractive_quotes
        text:
          type: string
          minLength: 1
          maxLength: 16384
          description: Selected unchanged transcript quotes; UTF-8 <=16384 bytes, no inferred
            facts.
        source_artifact_id:
          type: string
          format: uuid
        source_sha256: &recognition_schema_001
          type: string
          pattern: ^[a-f0-9]{64}$
        summary_sha256: *recognition_schema_001
        policy_version:
          const: meeting-summary-v1
