        guest_link_id: {type: string, format: uuid}
        admitted_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        history_from_sequence: {type: integer, minimum: 1}
        converted_at: {type: [string, 'null'], format: date-time}
