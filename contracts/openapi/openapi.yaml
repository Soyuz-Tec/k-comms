openapi: 3.1.0
info:
  title: K-Comms API
  version: 0.3.0
  description: Tenant-scoped communication, administration, governance, integrations, safety, and operations.
servers:
  - url: /
tags:
  - name: System
  - name: Sessions
  - name: Guest Access
  - name: Instant Rooms
  - name: Users
  - name: Conversations
  - name: Calls
  - name: Telephony
  - name: Messages
  - name: Attachments
  - name: Administration
  - name: Governance
  - name: Integrations
  - name: Operations
  - name: Service API
paths:
  /health/live:
    get:
      tags: [System]
      operationId: live
      responses:
        '200':
          description: Process is live
  /health/ready:
    get:
      tags: [System]
      operationId: ready
      responses:
        '200':
          description: Required dependencies are ready
        '503':
          $ref: '#/components/responses/Error'
  /metrics:
    get:
      tags: [System]
      operationId: metrics
      security: [{metricsBearer: []}]
      responses:
        '200':
          description: Prometheus text exposition for internal scraping
          content:
            text/plain:
              schema: {type: string}
  /api/v1/status:
    get:
      tags: [System]
      operationId: status
      responses:
        '200':
          description: Service version and public capability availability
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
  /api/v1/bootstrap:
    post:
      tags: [Sessions]
      operationId: bootstrapTenant
      summary: Create a development workspace when bootstrap is enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Workspace and owner session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
  /api/v1/sessions:
    post:
      tags:
      - Sessions
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session or a required one-use MFA challenge
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TokenResponse'
                - $ref: '#/components/schemas/MfaChallenge'
        '401':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/sessions/refresh:
    post:
      tags: [Sessions]
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: {type: string, minLength: 40}
      responses:
        '200':
          description: Rotated session credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
  /api/v1/password-recovery/requests:
    post:
      tags: [Sessions]
      operationId: requestPasswordRecovery
      summary: Queue password recovery without revealing whether the account exists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        '202':
          description: Request accepted for both known and unknown identities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryAccepted'
        '429':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
  /api/v1/password-recovery/resets:
    post:
      tags: [Sessions]
      operationId: resetPasswordWithRecoveryToken
      summary: Consume a one-time recovery token and revoke existing access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryReset'
      responses:
        '204': {description: Password changed; no session is created}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '426': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/sessions/current:
    delete:
      tags: [Sessions]
      operationId: revokeCurrentSession
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/instant-rooms:
    post:
      tags: [Instant Rooms]
      operationId: createInstantRoom
      summary: Create a feature-gated communication room in the configured public tenant
      description: Accepts no bearer or one valid human bearer. Invalid, guest, service, malformed, or duplicate Authorization values fail closed. A same-tenant human with workspace or conversation-only scope becomes the registered owner; only a valid human from another tenant is represented by a distinct conversation-only guest in the configured tenant, without cross-tenant linking or authority widening. Every caller supplies the exact trusted Origin and application/json. Exact idempotent replay within ten minutes reissues the usable encrypted response and never creates another room or identity.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/RequiredTrustedOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInstantRoomRequest'}
      responses:
        '200':
          description: Exact idempotent replay of the existing room and usable bounded credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstantRoomCreationResponse'}
        '201':
          description: Instant room, unique join link, and anonymous guest session when applicable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstantRoomCreationResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/InstantRoomConflict'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/InstantRoomRateLimited'}
        '503':
          description: Instant-room feature, tenant, replay encryption, or required public dependency unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstantRoomsUnavailableError'}
  /api/v1/instant-rooms/preview:
    post:
      tags: [Instant Rooms]
      operationId: previewInstantRoom
      summary: Resolve display-safe metadata for one available instant-room token
      description: Accepts no bearer or one valid human bearer; supplied invalid, guest, service, malformed, or duplicate Authorization values fail closed. Every caller supplies the exact trusted Origin and application/json. The response never reveals the configured tenant, room id, conversation id, lifecycle generation, token, or replay metadata.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequiredTrustedOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstantRoomTokenRequest'}
      responses:
        '200':
          description: Display-safe room preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstantRoomPreviewResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404':
          description: The room token is malformed, unknown, expired, exhausted, revoked, or unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstantRoomUnavailableError'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/InstantRoomRateLimited'}
        '503':
          description: Instant-room feature, tenant, or required public dependency unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstantRoomsUnavailableError'}
  /api/v1/instant-room-sessions:
    post:
      tags: [Instant Rooms]
      operationId: joinInstantRoom
      summary: Join one instant room as a scoped guest or the authenticated human
      description: Accepts no bearer or one valid human bearer; supplied invalid, guest, service, malformed, or duplicate Authorization values fail closed. Every caller supplies the exact trusted Origin, application/json, and a distinct idempotency key. A same-tenant human with workspace or conversation-only scope joins directly; only a valid human from another tenant uses a distinct conversation-only guest, without cross-tenant linking or authority widening. Guest replay resumes the same identity and admission with newly bounded credentials; signed-in replay never creates a duplicate membership.
      security: [{}, {bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/RequiredTrustedOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInstantRoomSessionRequest'}
      responses:
        '200':
          description: Exact idempotent replay for the existing admission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstantRoomSessionResponse'}
        '201':
          description: Guest session or authenticated-human membership created for one room
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstantRoomSessionResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404':
          description: The room token is malformed, unknown, expired, exhausted, revoked, or unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstantRoomUnavailableError'}
        '409': {$ref: '#/components/responses/InstantRoomConflict'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/InstantRoomRateLimited'}
        '503':
          description: Instant-room feature, tenant, replay state, or required public dependency unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstantRoomsUnavailableError'}
  /api/v1/guest-links/preview:
    post:
      tags: [Guest Access]
      operationId: previewGuestLink
      summary: Resolve the non-sensitive destination of an available guest link
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GuestLinkTokenRequest'}
      responses:
        '200':
          description: Available link destination; the raw token is never echoed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestLinkPreviewResponse'}
        '404':
          description: The link is unknown, malformed, expired, exhausted, or revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestLinkUnavailableError'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/guest-sessions:
    post:
      tags: [Guest Access]
      operationId: createGuestSession
      summary: Atomically redeem a guest link and create its scoped guest session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGuestSessionRequest'}
      responses:
        '201':
          description: Guest admitted to exactly one conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestSessionResponse'}
        '404':
          description: The link is unknown, malformed, expired, exhausted, or revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestLinkUnavailableError'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/guest/sessions/refresh:
    post:
      tags: [Guest Access]
      operationId: refreshGuestSession
      summary: Rotate guest credentials without extending the immutable admission deadline
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenRequest'}
      responses:
        '200':
          description: Rotated guest credentials bounded by the original admission expiry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestSessionResponse'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/guest/sessions/current:
    delete:
      tags: [Guest Access]
      operationId: revokeCurrentGuestSession
      security: [{guestBearerAuth: []}]
      responses:
        '204':
          description: Guest session, admission, membership, active room presence, and derived call authority atomically revoked; retained content is not deleted
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/guest/conversation:
    get:
      tags: [Guest Access]
      operationId: getGuestConversation
      security: [{guestBearerAuth: []}]
      responses:
        '200':
          description: The one conversation bound to the guest admission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestConversationResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/guest/conversation/members:
    get:
      tags: [Guest Access]
      operationId: listGuestConversationMembers
      security: [{guestBearerAuth: []}]
      responses:
        '200':
          description: Sanitized active members of the admitted conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestMemberListResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/guest/conversation/messages:
    get:
      tags: [Guest Access]
      operationId: listGuestConversationMessages
      summary: Read only messages at or after the immutable admission history boundary
      security: [{guestBearerAuth: []}]
      parameters:
        - name: after_sequence
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: before_sequence
          in: query
          schema: {type: integer, minimum: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
        - name: include
          in: query
          description: Opt in to privacy-minimal labels for senders referenced by this authorized page
          schema: {type: string, enum: [sender_labels]}
      responses:
        '200':
          description: Ordered message page clipped to the admission history boundary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Guest Access]
      operationId: createGuestConversationMessage
      security: [{guestBearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendMessageRequest'}
      responses:
        '201':
          description: Canonical committed guest message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/InstantRoomRateLimited'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/guest/conversation/message-sender-labels:
    post:
      tags: [Guest Access]
      operationId: refreshGuestMessageSenderLabels
      summary: Refresh labels for rendered authors inside the guest admission history boundary
      security: [{guestBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SenderLabelRefreshRequest'}
      responses:
        '200':
          description: Labels derived only from requested messages inside guest-visible history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SenderLabelRefreshResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/guest/conversation/read-cursor:
    put:
      tags: [Guest Access]
      operationId: updateGuestConversationReadCursor
      security: [{guestBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadCursorRequest'}
      responses:
        '200':
          description: Stored monotonic read cursor at or after the admission boundary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadCursorResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/guest/conversation/whiteboard/operations:
    get:
      tags: [Whiteboards, Guest Access]
      operationId: listGuestInstantRoomWhiteboardOperations
      summary: Replay the current instant-room whiteboard for its scoped participant
      security: [{guestBearerAuth: []}]
      parameters:
        - name: after_sequence
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 500}
        - name: snapshot
          in: query
          description: Opt in to a materialised scene for a fresh replay. Ignored when after_sequence is greater than zero, because an incremental caller already holds a scene.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Canonically ordered operations for the admitted active instant room; ordinary guest links are denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhiteboardOperationPage'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Whiteboards, Guest Access]
      operationId: appendGuestInstantRoomWhiteboardOperation
      summary: Commit a scoped instant-room scene update or collaborative clear
      security: [{guestBearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WhiteboardOperationRequest'}
      responses:
        '200':
          description: Existing canonical operation returned for an exact idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhiteboardOperationResponse'}
        '201':
          description: Canonical instant-room operation committed and eligible for post-commit broadcast
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhiteboardOperationResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/InstantRoomRateLimited'}
  /api/v1/guest/socket-tickets:
    post:
      tags: [Guest Access]
      operationId: createGuestSocketTicket
      security: [{guestBearerAuth: []}]
      responses:
        '201':
          description: One-time socket ticket restricted to the admitted conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocketTicketResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/guest/conversation/call:
    get:
      tags: [Guest Access]
      operationId: getGuestActiveCall
      security: [{guestBearerAuth: []}]
      responses:
        '200':
          description: Active call in the admitted conversation or null
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudioCallLookupResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/guest/conversation/calls:
    post:
      tags: [Guest Access]
      operationId: startGuestCall
      security: [{guestBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartCallRequest'}
      responses:
        '200':
          description: Existing call of the requested media kind with a fresh credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestAudioCallCredentialResponse'}
        '201':
          description: Call created with a fresh credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestAudioCallCredentialResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/GuestCallForbidden'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '426': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/guest/conversation/calls/{callId}/join:
    parameters:
      - $ref: '#/components/parameters/AudioCallId'
    post:
      tags: [Guest Access]
      operationId: joinGuestCall
      security: [{guestBearerAuth: []}]
      responses:
        '200':
          description: Guest admitted with a fresh participant credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestAudioCallCredentialResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/GuestCallForbidden'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '426': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/guest/conversation/calls/{callId}/end:
    parameters:
      - $ref: '#/components/parameters/AudioCallId'
    post:
      tags: [Guest Access]
      operationId: endGuestCall
      security: [{guestBearerAuth: []}]
      responses:
        '200':
          description: Guest-started call ended
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudioCallResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/guest/account:
    post:
      tags: [Guest Access]
      operationId: convertGuestAccount
      summary: Convert the current guest in place and issue a fresh human session
      security: [{guestBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConvertGuestAccountRequest'}
      responses:
        '200':
          description: Same user converted to a permanent human account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GuestAccountConversionResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/GuestConversionForbidden'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/InstantRoomRateLimited'}
        '426': {$ref: '#/components/responses/Error'}
        '503':
          description: Instant-room account conversion is feature-disabled or unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstantRoomsUnavailableError'}
  /api/v1/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Current tenant, user, and device"}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Tenant users}
  /api/v1/directory/users:
    get:
      tags: [Users]
      operationId: listDirectoryUsers
      summary: List active human users visible to the current member
      security: [{bearerAuth: []}]
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 120}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: cursor
          in: query
          description: Opaque continuation cursor returned by the previous page
          schema: {type: string}
      responses:
        '200':
          description: Bounded tenant-scoped active-human directory with no email, role, or lifecycle data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectoryPersonPage'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Conversations visible to the current user}
    post:
      tags: [Conversations]
      operationId: createConversation
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201': {description: Conversation created}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
