                  data: {type: object}
                  upload: {$ref: '#/components/schemas/PresignDescriptor'}
                  thumbnail_upload:
                    allOf: [{$ref: '#/components/schemas/PresignDescriptor'}]
                    description: >-
                      Present only when a thumbnail variant was declared and
                      could be authorized. A variant is an enhancement, so its
                      absence is not an error and the client proceeds without
                      one.
