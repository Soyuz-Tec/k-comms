          type: object
          additionalProperties: false
          required: [id, tenant_id, conversation_id, created_by_user_id, expires_at, max_uses, use_count, remaining_uses, conversion_enabled, email_hint, status, revoked_at, version, inserted_at, share_url]
          properties:
            id: {type: string, format: uuid}
            tenant_id: {type: string, format: uuid}
            conversation_id: {type: string, format: uuid}
            created_by_user_id: {type: string, format: uuid}
            expires_at: {type: string, format: date-time}
            max_uses: {type: integer, minimum: 1, maximum: 25}
            use_count: {type: integer, minimum: 0}
            remaining_uses: {type: integer, minimum: 0}
            conversion_enabled: {type: boolean}
            email_hint:
              type: [string, 'null']
              maxLength: 320
              description: Non-reversible masked hint for the pre-authorized conversion email, or null when conversion is disabled.
            status: {enum: [active, expired, revoked, exhausted]}
            revoked_at: {type: [string, 'null'], format: date-time}
            version: {type: integer, minimum: 1}
            inserted_at: {type: string, format: date-time}
            share_url:
              type: string
              format: uri
              pattern: '/join#guest='
              readOnly: true
        token:
          type: string
          minLength: 80
          maxLength: 80
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.[A-Za-z0-9_-]{43}$'
          readOnly: true
          description: Raw link token returned once and never available from list or revoke.
        share_url:
          type: string
          format: uri
          pattern: '/join#guest='
          readOnly: true
          description: Complete share URL returned only with the one-time raw token.
        conversion_verification_code:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          readOnly: true
          description: Returned once only for a conversion-enabled link; keep separate from the QR and share URL.
