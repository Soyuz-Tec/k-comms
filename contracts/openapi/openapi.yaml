        allow_video_calls: {type: boolean}
        conversion_enabled: {type: boolean}
        self_service_conversion:
          type: boolean
          description: Present and true only for an instant-room guest eligible for conversation-only conversion; it is not evidence of verified email.
        email_hint:
          type: [string, 'null']
          maxLength: 320
          description: Non-reversible masked hint for the pre-authorized conversion email, or null when conversion is disabled.
    GuestLink:
      type: object
      additionalProperties: false
      required: [id, tenant_id, conversation_id, created_by_user_id, expires_at, max_uses, use_count, remaining_uses, conversion_enabled, email_hint, status, revoked_at, version, inserted_at]
      properties:
