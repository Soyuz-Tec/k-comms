        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
        '426': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/telephony/calls:
    get:
      tags: [Telephony]
      operationId: listTelephonyCalls
      summary: List the authenticated user's durable phone call history
      description: Tenant and user scope come from the current human session. Records describe observed connection time, not carrier billable duration or invoices.
      security: [{bearerAuth: []}]
      parameters:
        - name: scope
          in: query
          description: all and recent return owned history; active returns ringing/answered calls; missed returns inbound no-answer/busy calls.
          schema: {enum: [all, recent, active, missed], default: all}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
        - name: cursor
          in: query
          description: Opaque continuation cursor returned by the preceding page
          schema: {type: string}
      responses:
        '200':
          description: User-owned phone records, with no provider identifiers or credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelephonyCallPage'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      tags: [Telephony]
      operationId: startTelephonyCall
      summary: Dial an external E.164 number from the assigned tenant number
      description: Persists a ringing call and provider command before dispatch. Reusing the same idempotency key and destination refers to the same call; a changed destination conflicts. The provider's verified answer observation determines answered state. Browser media admission remains bound to the current user, session, and device.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartTelephonyCallRequest'}
      responses:
        '200':
          description: Existing idempotent call and a fresh device-bound media credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelephonyCallCredentialResponse'}
        '201':
          description: Outbound call and a short-lived media credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelephonyCallCredentialResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '426': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/telephony/calls/{callId}:
