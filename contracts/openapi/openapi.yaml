        '200':
          description: Administrator phone configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelephonyConfigResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    put:
      tags: [Telephony, Administration]
      operationId: configureTenantTelephony
      summary: Assign one tenant number and extension to an active tenant member
      description: Requires tenant administration and recent password verification. The number must be acquired and both trunks provisioned with the carrier and LiveKit before assignment. This endpoint does not purchase numbers, provision trunks, or enable the deployment feature flag.
