      security: [{bearerAuth: []}]
      responses:
        '200': {description: Redacted tenant webhook endpoints}
    post:
      tags: [Integrations]
      operationId: createWebhookEndpoint
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWebhookEndpointRequest'}
      responses:
        '201': {description: Endpoint and one-time signing secret}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/admin/webhooks/{endpointId}:
    parameters:
      - {name: endpointId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Integrations]
      operationId: getWebhookEndpoint
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Redacted webhook endpoint}
    patch:
      tags: [Integrations]
      operationId: updateWebhookEndpoint
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWebhookEndpointRequest'}
      responses:
        '200': {description: Updated endpoint and subscriptions}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Integrations]
      operationId: disableWebhookEndpoint
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Endpoint disabled}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/admin/webhooks/{endpointId}/rotate-secret:
    parameters:
      - {name: endpointId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Integrations]
      operationId: rotateWebhookSecret
      security: [{bearerAuth: []}]
      responses:
        '200': {description: New one-time signing secret}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/admin/webhook-deliveries:
    get:
      tags: [Integrations]
      operationId: listWebhookDeliveries
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Redacted webhook delivery ledger}
  /api/v1/admin/webhook-deliveries/{deliveryId}/replay:
    parameters:
      - {name: deliveryId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Integrations]
      operationId: replayWebhookDelivery
      security: [{bearerAuth: []}]
      responses:
        '202': {description: Webhook replay accepted}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/admin/attachment-safety:
    get:
      tags: [Attachments, Administration]
      operationId: listAttachmentSafety
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Tenant attachment scan and quarantine state}
  /api/v1/admin/attachment-safety/{attachmentId}/retry:
    parameters:
      - {$ref: '#/components/parameters/AttachmentId'}
    post:
      tags: [Attachments, Administration]
      operationId: retryAttachmentScan
      security: [{bearerAuth: []}]
      responses:
        '202': {description: Scan retry accepted}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/service/conversations:
    get:
      tags: [Service API]
      operationId: listServiceConversations
      security: [{serviceAccountAuth: []}]
      x-required-scope: conversations:read
      responses:
        '200':
          description: Active conversations visible to the service principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceConversationListResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/service/conversations/{conversation_id}/messages:
    parameters:
      - {name: conversation_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Service API]
      operationId: listServiceConversationMessages
      security: [{serviceAccountAuth: []}]
      x-required-scope: messages:read
      parameters:
        - {name: after_sequence, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Membership-filtered durable message history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [Service API]
      operationId: sendServiceConversationMessage
      security: [{serviceAccountAuth: []}]
      x-required-scope: messages:write
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceSendMessageRequest'}
      responses:
        '200': {description: Existing canonical message returned for an idempotent replay}
        '201': {description: Canonical message committed}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/service/search:
    get:
      tags: [Service API]
      operationId: searchServiceMessages
      security: [{serviceAccountAuth: []}]
      x-required-scope: search:read
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Search matches restricted to readable service-principal memberships
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceSearchResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/ops:
    get:
      tags: [Operations]
      operationId: getOperationsSnapshot
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Content-free tenant operations snapshot, provider state, and immutable release revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationsSnapshotResponse'}
  /api/v1/ops/retry:
    post:
      tags: [Operations]
      operationId: retryOperationalResource
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetryOperationalResourceRequest'}
      responses:
        '202': {description: Retry accepted}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/platform/ops:
    get:
      tags: [Operations]
      operationId: getPlatformOperationsSnapshot
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Content-free global health snapshot and immutable release revision for platform, support, and security operators"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationsSnapshotResponse'}
        '403': {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: K-Comms signed access token
    metricsBearer:
      type: http
      scheme: bearer
      bearerFormat: Dedicated metrics scraper token
    serviceAccountAuth:
      type: http
      scheme: bearer
      bearerFormat: kcsa_<uuid>.<one-time-secret>
      description: Dedicated service credential; never accepted on human, admin, platform, refresh, or WebSocket routes.
    guestBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: K-Comms guest access token
      description: Conversation-scoped guest credential; rejected by human, admin, operations, service, and normal refresh routes.
  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    GuestLinkId:
      name: guestLinkId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AudioCallId:
      name: callId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MessageId:
      name: messageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exact canonical 256-bit unpadded Base64URL replay key. Create stores its SHA-256 digest and a ten-minute AES-GCM secret-response capsule; join stores a digest, request fingerprint, and bounded replay receipt and mints fresh bounded authentication. A changed request fingerprint under the same key conflicts.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
    RequiredTrustedOrigin:
      name: Origin
      in: header
      required: true
      description: Exact configured trusted origin. Browser and non-browser callers supply one value; this CSRF boundary is not authentication and never selects the public tenant.
      schema: {type: string, format: uri, minLength: 1, maxLength: 2048}
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional replay key; a successful replay returns the existing resource and never reissues a one-time secret.
      schema: {type: string, minLength: 1, maxLength: 200}
  responses:
    Error:
      description: Structured request failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InstantRoomConflict:
      description: Instant-room idempotency conflict or expired replay window
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            fingerprint_conflict:
              value:
                error:
                  code: idempotency_conflict
                  detail: The idempotency key was already used with a different request
            replay_expired:
              value:
                error:
                  code: idempotency_replay_expired
                  detail: The idempotency replay window has expired
    InstantRoomRateLimited:
      description: Shared public-admission or communication limit exceeded
      headers:
        Retry-After:
          description: Whole seconds before the client should retry.
          required: true
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/InstantRoomRateLimitedError'}
    GuestCallForbidden:
      description: Guest call access is forbidden or its bounded authorization has expired
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            authorization_expired:
              value:
                error:
                  code: call_authorization_expired
                  detail: Call access is no longer authorized
    GuestConversionForbidden:
      description: The guest link did not authorize conversion for the supplied email or verification code
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            conversion_not_enabled:
              value:
                error:
                  code: guest_account_conversion_not_enabled
                  detail: Account creation is not permitted for this guest link
            conversion_email_mismatch:
              value:
                error:
                  code: guest_account_conversion_email_mismatch
                  detail: Account creation is not permitted for the supplied email
            conversion_verification_failed:
              value:
                error:
                  code: guest_account_conversion_verification_failed
                  detail: Account conversion verification failed
    GuestLinkForbidden:
      description: Guest-link creation or account-conversion preauthorization is forbidden
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            conversion_forbidden:
              value:
                error:
                  code: guest_account_conversion_forbidden
                  detail: Account creation is not permitted for this guest link
    GuestLinkUnprocessable:
      description: Guest-link settings are invalid or incompatible
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            conversion_requires_single_use:
              value:
                error:
                  code: guest_account_conversion_requires_single_use
                  detail: Account-enabled guest links must allow exactly one use
            invalid_conversion_email:
              value:
                error:
                  code: invalid_guest_conversion_email
                  detail: The account conversion email is invalid
  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [service, version, status, capabilities]
      properties:
        service: {const: k-comms}
        version: {type: string}
        status: {type: string}
        capabilities:
          type: object
          additionalProperties: false
          required: [administration, audio_calls, video_calls, attachment_scanning, bootstrap, guest_links, instant_rooms, notifications, push_notifications, realtime, secure_account_actions, secure_media_actions, webhooks]
          properties:
            administration: {type: boolean}
            audio_calls:
              type: boolean
              description: True only while the cached, bounded LiveKit control-plane readiness probe is fresh and successful.
            video_calls:
              type: boolean
              description: True only while the cached, bounded LiveKit control-plane readiness probe is fresh and successful.
            attachment_scanning: {type: boolean}
            bootstrap: {type: boolean}
            guest_links: {type: boolean}
            instant_rooms:
              type: boolean
              description: False unless instant rooms are enabled and the configured public tenant slug resolves to one active tenant. Production still requires verification, adaptive distributed abuse controls, privacy, provider, and operations approval.
            notifications: {type: boolean}
            push_notifications: {type: boolean}
            realtime: {type: boolean}
            secure_account_actions:
              type: boolean
              description: False for clear-text HTTP requests handled by the explicit LAN text-only release, regardless of the request Host. Clients must fail closed until this value is known.
            secure_media_actions:
              type: boolean
              description: False when call credential and media-control operations require a trusted HTTPS request. Clients combine this value with audio_calls or video_calls.
            webhooks: {type: boolean}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, detail]
          properties:
            code: {type: string}
            detail: {type: string}
            meta: {}
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [tenant_name, tenant_slug, display_name, email, password]
      properties:
        tenant_name: {type: string, minLength: 2, maxLength: 120}
        tenant_slug: {type: string, minLength: 2, maxLength: 80}
        display_name: {type: string, minLength: 1, maxLength: 120}
        email: {type: string, format: email}
        password: {type: string, minLength: 12, maxLength: 256}
        device_name: {type: string, maxLength: 120}
        device_platform: {type: string, maxLength: 40}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [tenant_slug, email, password]
      properties:
        tenant_slug: {type: string}
        email: {type: string, format: email}
        password: {type: string}
        device:
          type: object
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
            platform: {type: string}
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: {type: string, minLength: 40, maxLength: 512, writeOnly: true}
    InstantRoomDevice:
      type: object
      additionalProperties: false
      required: [name, platform]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        platform: {type: string, minLength: 1, maxLength: 40}
    CreateInstantRoomRequest:
      type: object
      additionalProperties: false
      description: Anonymous creation requires a complete device and a chosen display_name. A same-tenant human with workspace or conversation-only scope uses only title and its trusted profile identity. For a valid human from another tenant, the adapter supplies trusted current profile/device defaults for the distinct conversation-only guest fallback.
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        display_name:
          type: string
          minLength: 1
          maxLength: 120
          description: Required for an anonymous creator; ignored for a same-tenant authenticated human.
        device: {$ref: '#/components/schemas/InstantRoomDevice'}
    InstantRoomTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
          writeOnly: true
          description: Opaque 256-bit join token captured from the client-side URL fragment.
    CreateInstantRoomSessionRequest:
      type: object
      additionalProperties: false
      required: [token]
      description: Anonymous join requires display_name and a complete device. A same-tenant human with workspace or conversation-only scope uses only token. For a valid human from another tenant, the adapter supplies trusted current profile/device defaults for the distinct conversation-only guest fallback.
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
          writeOnly: true
        display_name:
          type: string
          minLength: 1
          maxLength: 120
          description: Required when joining anonymously; ignored for an authenticated human.
        device: {$ref: '#/components/schemas/InstantRoomDevice'}
    InstantRoom:
      type: object
      additionalProperties: false
      required: [id, conversation_id, owner_user_id, owner_kind, status, participant_limit, idle_since, expires_at, inserted_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        owner_user_id: {type: string, format: uuid}
        owner_kind: {enum: [guest, registered]}
        status: {enum: [active, idle, expired]}
        participant_limit: {type: integer, minimum: 2, maximum: 25}
        idle_since: {type: [string, 'null'], format: date-time}
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Authoritative idle-expiry deadline once the room is idle; null while active.
        inserted_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    InstantRoomCreationResponse:
      type: object
      additionalProperties: false
      required: [room, conversation, token, share_url, replayed]
      properties:
        room: {$ref: '#/components/schemas/InstantRoom'}
        conversation: {$ref: '#/components/schemas/Conversation'}
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
          readOnly: true
          description: Freshly disclosed or exact-replay-decrypted join token; never returned by preview or room reads.
        share_url:
          type: string
          format: uri
          pattern: '/join#guest='
          readOnly: true
        replayed: {type: boolean}
        access_token: {type: string, readOnly: true}
        refresh_token: {type: string, readOnly: true}
        token_type: {const: Bearer}
        expires_in: {type: integer, minimum: 1}
        tenant:
          type: object
          description: Present only for the anonymous creator session.
        user: {$ref: '#/components/schemas/GuestUser'}
        device: {type: object}
        admission: {$ref: '#/components/schemas/GuestAdmission'}
        membership: {$ref: '#/components/schemas/MembershipSummary'}
        capabilities: {$ref: '#/components/schemas/GuestCapabilities'}
    InstantRoomPreviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [room_title, status, expires_at, participant_limit]
          properties:
            room_title: {type: string, minLength: 1, maxLength: 160}
            status: {enum: [active, idle]}
            expires_at:
              type: [string, 'null']
              format: date-time
              description: Idle-expiry deadline, or null while the room is active.
            participant_limit: {type: integer, minimum: 2, maximum: 25}
    InstantRoomSessionResponse:
      type: object
      additionalProperties: false
      required: [room, conversation, replayed]
      properties:
        room: {$ref: '#/components/schemas/InstantRoom'}
        conversation: {$ref: '#/components/schemas/Conversation'}
        replayed: {type: boolean}
        access_token: {type: string, readOnly: true}
        refresh_token: {type: string, readOnly: true}
        token_type: {const: Bearer}
        expires_in: {type: integer, minimum: 1}
        tenant:
          type: object
          description: Present only for an anonymous guest join.
        user: {$ref: '#/components/schemas/GuestUser'}
        device: {type: object}
        admission: {$ref: '#/components/schemas/GuestAdmission'}
        membership: {$ref: '#/components/schemas/MembershipSummary'}
        capabilities: {$ref: '#/components/schemas/GuestCapabilities'}
    InstantRoomUnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, detail]
          properties:
            code: {const: instant_room_unavailable}
            detail: {const: This instant communication room is unavailable}
    InstantRoomsUnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, detail]
          properties:
            code: {const: instant_rooms_unavailable}
            detail: {const: Instant communication rooms are unavailable}
    InstantRoomRateLimitedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, detail, retry_after]
          properties:
            code: {const: rate_limited}
            detail: {const: Too many requests}
            retry_after: {type: integer, minimum: 1}
    CreateGuestLinkRequest:
      type: object
      additionalProperties: false
      properties:
        expires_in_seconds:
          type: integer
          minimum: 900
          maximum: 86400
          default: 86400
        max_uses:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
        conversion_email:
          type: [string, 'null']
          format: email
          maxLength: 320
          writeOnly: true
          description: Optional exact email pre-authorized for in-place account conversion; requires a single-use link and recent host step-up.
    GuestLinkTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 80
          maxLength: 80
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: One-time-disclosed link secret read from the client-side URL fragment.
    CreateGuestSessionRequest:
      type: object
      additionalProperties: false
      required: [token, display_name]
      properties:
        token:
          type: string
          minLength: 80
          maxLength: 80
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.[A-Za-z0-9_-]{43}$'
          writeOnly: true
        display_name: {type: string, minLength: 1, maxLength: 120}
        device:
          type: object
          additionalProperties: false
          properties:
            name: {type: string, minLength: 1, maxLength: 120}
            platform: {type: string, minLength: 1, maxLength: 40}
    ConvertGuestAccountRequest:
      description: Selects the verification-bound standard-link conversion or the production-gated, conversation-only instant-room conversion from server-authoritative admission purpose. The instant-room email is not a verified-email claim.
      oneOf:
        - $ref: '#/components/schemas/ConvertVerifiedGuestAccountRequest'
        - $ref: '#/components/schemas/ConvertInstantRoomGuestAccountRequest'
    ConvertVerifiedGuestAccountRequest:
      type: object
      additionalProperties: false
      required: [email, verification_code, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        verification_code:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
          description: Independently generated one-time conversion verification code disclosed only to the authenticated link creator.
        password: {type: string, minLength: 12, maxLength: 256, writeOnly: true}
        display_name: {type: string, minLength: 1, maxLength: 120}
        device:
          type: object
          additionalProperties: false
          properties:
            name: {type: string, minLength: 1, maxLength: 120}
            platform: {type: string, minLength: 1, maxLength: 40}
    ConvertInstantRoomGuestAccountRequest:
      type: object
      additionalProperties: false
      required: [email, password]
