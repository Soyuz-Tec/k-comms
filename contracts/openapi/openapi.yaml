    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Messages]
      operationId: refreshMessageSenderLabels
      summary: Refresh labels for rendered authors inside the caller's authorized history
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SenderLabelRefreshRequest'}
      responses:
        '200':
          description: Labels derived only from requested messages inside authorized history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SenderLabelRefreshResponse'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/conversations/{conversationId}/whiteboard/operations:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Whiteboards]
      operationId: listWhiteboardOperations
      summary: Replay the durable conversation whiteboard operation stream
      security: [{bearerAuth: []}]
      parameters:
        - name: after_sequence
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 500}
        - name: snapshot
          in: query
          description: Opt in to a materialised scene for a fresh replay. Ignored when after_sequence is greater than zero, because an incremental caller already holds a scene.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Canonically ordered operations; a fresh replay begins at the latest clear
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhiteboardOperationPage'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Whiteboards]
      operationId: appendWhiteboardOperation
      summary: Commit one idempotent scene update or collaborative clear
      security: [{bearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WhiteboardOperationRequest'}
      responses:
        '200':
          description: Existing canonical operation returned for an exact idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhiteboardOperationResponse'}
        '201':
          description: Canonical operation committed and eligible for post-commit broadcast
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhiteboardOperationResponse'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
